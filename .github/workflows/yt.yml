name: YouTube Auto Studio

on:
  workflow_dispatch:
    inputs:
      format:
        description: "short ya long"
        required: true
        default: "short"
        type: choice
        options: [short, long]
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: yt-studio
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Install python packages
        run: pip install -r requirements.txt
      - name: Decide format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "f=${{ github.event.inputs.format }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 12 * * *" ]; then
            echo "f=long" >> $GITHUB_OUTPUT
          else
            echo "f=short" >> $GITHUB_OUTPUT
          fi
      - name: Make video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ENABLE_UPLOAD: ${{ vars.ENABLE_UPLOAD }}
        run: python src/main.py --format ${{ steps.fmt.outputs.f }}
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ steps.fmt.outputs.f }}-${{ github.run_number }}
          path: |
            out/*.mp4
            out/thumb.png
            out/meta.json
            out/plan.json
          retention-days: 7
      - name: Save state
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
